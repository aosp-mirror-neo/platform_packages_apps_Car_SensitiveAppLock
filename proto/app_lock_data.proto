syntax = "proto3";

package com.android.car.sensitiveapplock;

option java_multiple_files = true;

// A user's App Lock data.
message AppLockData {
    // User's PIN.
    string password = 1;
    // List of package names of the locked apps.
    repeated string locked_apps = 2;
    // ReAuth pin recovery account
    RecoveryAccount re_auth_recovery_account = 3;
    // Discovery notification interaction count
    int32 discovery_notification_interaction_count = 4;
    // Discovery notification permanently dismissed
    bool discovery_notification_permanently_dismissed = 5;
}

message RecoveryAccount {
    string name = 1;
    string type = 2;
}
